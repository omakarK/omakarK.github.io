# Place this file inside the http context, such as /etc/nginx/conf.d/oak-whimsy.conf.
limit_req_zone $binary_remote_addr zone=oak_shop_api:10m rate=10r/s;

server {
    listen 80;
    server_name toyjoypocket.com;
    return 301 https://toyjoypocket.com$request_uri;
}

server {
    listen 443 ssl;
    server_name toyjoypocket.com;
    ssl_certificate /etc/letsencrypt/live/toyjoypocket.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toyjoypocket.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 45m;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    location /api/ {
        limit_req zone=oak_shop_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
